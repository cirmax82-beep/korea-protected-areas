<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보호구역 종합포털</title>
  <meta name="description" content="국내 생물·환경 보호구역을 지도에서 보고 경계를 SHP·GeoJSON으로 내려받는 포털입니다(준비 중)." />
  <style>
    :root { --bg: #f3f5f1; --text: #1d2a20; --muted: #5d6b60; --accent: #2b8a3e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111713; --text: #e3eae2; --muted: #9aa89b; --accent: #51cf66; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 560px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.6; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>보호구역 종합포털</h1>
    <p>국내 생물·환경 관련 보호구역을 지도에서 보고, 구역별 경계를 SHP·GeoJSON으로 내려받을 수 있는 포털을 준비하고 있습니다.</p>
    <p>시군구별 보호구역 지정 현황은 <a href="https://zone.biogrideia.com/">환경 지구·지역 현황</a>에서 볼 수 있습니다.</p>
  </main>
</body>
</html>
